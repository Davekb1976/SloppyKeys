# Compile and run the assert scripts in tests/. Windows only: the whole project is ctypes
# to Win32, so a Linux job would fail at import and prove nothing.
name: ci

# Nothing here can fail because of a prose change, so documentation, steering and the landing
# page are excluded: a full Windows runner installing PySide6, OpenCV and onnxruntime to
# compile code that didn't change is minutes spent on nothing. `website/` has its own
# workflow (pages.yml).
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.kiro/**'
      - 'website/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.kiro/**'
      - 'website/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

# A newer push supersedes an older run on the same branch. Waiting out a queued job for a
# commit that has already been replaced tells you nothing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip

      - run: pip install -r requirements.txt

      # compileall does not execute anything, so it catches syntax only. The tests below
      # are what catch a bad import or a def that slid into a class body.
      - run: python -m compileall -q sloppykeys

      # Framework-free: each file is a script of asserts that exits non-zero on failure
      # (see .kiro/steering/implementation-process.md). No pytest, nothing to configure.
      # No display needed: nothing here constructs a window any more — the tests that
      # needed `QT_QPA_PLATFORM=offscreen` were testing the deleted PySide6 UI.
      - name: tests
        run: |
          $failed = @()
          Get-ChildItem tests\test_*.py | ForEach-Object {
            Write-Host "--- $($_.Name)"
            python $_.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $_.Name }
          }
          if ($failed.Count) { throw "failed: $($failed -join ', ')" }

      # `node --check` only parses app.js. This runs it against a stub DOM, which is the
      # only thing that catches a top-level throw — it aborts every statement after it and
      # WebView2 has no console to say so. Node is preinstalled on the runner.
      - name: app.js loads
        run: node tests\test_app_js_loads.js
