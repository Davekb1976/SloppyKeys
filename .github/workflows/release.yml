# Publish a release. Triggered by the tag `bump_version.py` pushes, so cutting a release is
# one command on the developer's machine and nothing here needs a button.
#
# Builds the installer and a portable zip on a clean runner, which is the point: a build
# from the developer's machine can quietly depend on something only that machine has.
#
# **Run it by hand to rehearse it.** A `workflow_dispatch` builds everything and uploads the
# installer, the zip and the rendered notes as run artifacts, but publishes nothing — the
# publish step only fires for a tag push. Two pipeline bugs were each found by cutting a real
# release and rewinding it; a dry run costs a tag nothing.
#
# The tests are **not** run here. `bump_version.py` refuses to tag unless compileall and
# tests/ pass, and it pushes `main` before the tag, so ci.yml has already checked this exact
# commit on a clean runner. Running them again here was a second Windows job per release.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # gh release create
    steps:
      # Full history and tags: the notes step asks `git describe` for the previous tag to
      # build the compare link. A shallow clone has neither.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip

      # Pinned to the version the local builds were made with. PyInstaller is a build tool,
      # not a dependency of the app, so it isn't in requirements.txt.
      - run: pip install -r requirements.txt pyinstaller==6.21.0

      # The tag is the release name users see; version.py is what the titlebar and the
      # Discord footer show. Ship them disagreeing once and every bug report quotes the
      # wrong number. A dry run has no tag to compare against — the ref is a branch — so it
      # takes version.py at its word and names the artifacts from it.
      - name: version matches the tag
        id: version
        run: |
          $version = python -c "from sloppykeys.version import VERSION; print(VERSION)"
          if ('${{ github.event_name }}' -eq 'push') {
            $tag = '${{ github.ref_name }}'
            if ($tag -ne "v$version") { throw "tag $tag does not match version.py ($version)" }
          } else {
            Write-Host "dry run: building $version, publishing nothing"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      # No settings.json on a runner (it is gitignored — it holds the private-server link
      # and the webhook), so shipped_settings() carries nothing and the release ships pure
      # defaults with both secrets blank. That is exactly what a public build wants.
      - name: build
        run: python build_exe.py --dest "${{ runner.temp }}\payload"

      - name: portable zip
        run: |
          Compress-Archive -Path "${{ runner.temp }}\payload\*" `
            -DestinationPath "SloppyKeys-${{ steps.version.outputs.version }}-portable.zip"

      # Not preinstalled on the runner image. Chocolatey is, and it puts ISCC in
      # Program Files (x86) rather than the per-user path a winget install uses locally.
      - name: install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.version.outputs.version }}" `
            "/DPayload=${{ runner.temp }}\payload" `
            installer.iss

      # Published as an asset, not just quoted in the notes: the in-app updater
      # (core/updates.py) refuses to install anything it can't check against this file.
      # sha256sum format — two spaces between hash and name.
      - name: checksums
        run: |
          $v = '${{ steps.version.outputs.version }}'
          @("installer_output\SloppyKeys-Setup-$v.exe", "SloppyKeys-$v-portable.zip") |
            ForEach-Object {
              "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $(Split-Path $_ -Leaf)"
            } | Set-Content SHA256SUMS.txt -Encoding ascii

      # Python, not an inline PowerShell string: the notes are markdown full of backticks
      # and a backtick is PowerShell's escape character, so the inline version died at the
      # first code fence with "Unexpected token". See .github/release_notes.py.
      #
      # The **path argument, not `> notes.md`**: PowerShell re-encodes a redirected native
      # command's output, which shipped the 0.1.0 notes with two `U+FFFD` where the template
      # has em dashes. Python writes the file as UTF-8 itself.
      - name: notes
        run: |
          python .github/release_notes.py `
            '${{ steps.version.outputs.version }}' `
            '${{ steps.version.outputs.tag }}' `
            '${{ github.repository }}' notes.md
          Get-Content notes.md

      # Only a tag push publishes. A dry run stops here and hands the artifacts back, so the
      # whole pipeline can be exercised — including the notes — without spending a version.
      - name: publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          gh release create '${{ github.ref_name }}' --verify-tag `
            --title "SloppyKeys $v" --notes-file notes.md `
            "installer_output\SloppyKeys-Setup-$v.exe" "SloppyKeys-$v-portable.zip" `
            SHA256SUMS.txt

      - name: dry run artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.version }}-dry-run
          if-no-files-found: error
          path: |
            installer_output/SloppyKeys-Setup-${{ steps.version.outputs.version }}.exe
            SloppyKeys-${{ steps.version.outputs.version }}-portable.zip
            SHA256SUMS.txt
            notes.md
