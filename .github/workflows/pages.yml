# Publish website/ to GitHub Pages. A static three-file site, so there is nothing to build
# — the folder is uploaded as-is.
#
# One-time setup in the repo: Settings > Pages > Source = GitHub Actions. Without that this
# workflow fails at `deploy-pages` with "Pages is not enabled".
name: pages

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued run replaces a pending one instead of stacking: only the newest site matters.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website
      - id: deploy
        uses: actions/deploy-pages@v4
