# Publish website/ to GitHub Pages. A static three-file site, so there is nothing to build
# — the folder is uploaded as-is.
#
# Needs no manual setup: `configure-pages` below enables Pages itself. Serves from
# https://davekb1976.github.io/SloppyKeys/
name: pages

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued run replaces a pending one instead of stacking: only the newest site matters.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # `enablement: true` turns Pages on if it isn't already, so this doesn't need a
      # manual visit to Settings > Pages first — the first run failed for exactly that.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website
      - id: deploy
        uses: actions/deploy-pages@v4
